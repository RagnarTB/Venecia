<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Pizzería Venecia | Reservas y pedidos</title>
    <meta name="description" content="Reserva tu mesa o pide a domicilio en Pizzería Venecia, Chiclayo.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23C8372D'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FFF8EE;
            --sf: #fff;
            --s2: #F6E9D7;
            --tx: #2A1F1B;
            --mu: #6B5A4E;
            --pr: #C8372D;
            --on: #fff;
            --gr: #2F6B3F;
            --ln: #8A7767;
            --l2: #E4D3BC;
            --er: #B3261E;
            --sh: 0 10px 30px #2a1f1b1a
        }

        [data-t=dark] {
            --bg: #1C1512;
            --sf: #2E231D;
            --s2: #3A2D25;
            --tx: #F5EBDD;
            --mu: #B8A796;
            --pr: #E5594D;
            --on: #1C1512;
            --gr: #6FBF84;
            --ln: #8F7E6F;
            --l2: #4A3B31;
            --er: #F2877F;
            --sh: 0 10px 30px #0008
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        [hidden] {
            display: none !important
        }

        body {
            font: 16px/1.55 Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--tx);
            transition: background .3s, color .3s;
            padding-bottom: 72px
        }

        h1,
        h2,
        .logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700
        }

        h1 {
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.12;
            margin-bottom: 8px
        }

        h2 {
            font-size: 24px;
            margin: 40px 0 16px
        }

        h3 {
            font-size: 17px
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .mu {
            color: var(--mu)
        }

        .wrap {
            max-width: 1200px;
            margin: auto;
            padding: 0 16px
        }

        .nar {
            max-width: 440px;
            margin: 24px auto
        }

        .mid {
            max-width: 720px;
            margin: auto
        }

        .ctr {
            text-align: center
        }

        :focus-visible {
            outline: 3px solid var(--pr);
            outline-offset: 2px
        }

        .nav {
            position: sticky;
            top: 0;
            z-index: 9;
            background: color-mix(in srgb, var(--sf) 92%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--l2)
        }

        .ni {
            height: 64px;
            display: flex;
            align-items: center;
            gap: 16px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            color: var(--pr);
            margin-right: auto
        }

        .links {
            display: none;
            gap: 4px
        }

        .links a {
            padding: 8px 14px;
            border-radius: 99px;
            font-weight: 500
        }

        .links a.on {
            color: var(--pr);
            font-weight: 600;
            background: var(--s2)
        }

        .nr {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .btn {
            min-height: 48px;
            padding: 0 24px;
            border: 2px solid var(--pr);
            border-radius: 99px;
            background: var(--pr);
            color: var(--on);
            font: 600 16px Inter;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform .15s, filter .2s
        }

        .btn:hover {
            filter: brightness(1.08)
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn.s {
            background: none;
            color: var(--pr)
        }

        .btn.sm {
            min-height: 44px;
            padding: 0 18px
        }

        .btn.w {
            width: 100%
        }

        .btn[disabled] {
            opacity: .45;
            pointer-events: none
        }

        .ic {
            position: relative;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: var(--s2);
            font-size: 18px;
            cursor: pointer
        }

        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            background: var(--pr);
            color: var(--on);
            font: 700 12px/20px Inter;
            font-style: normal;
            text-align: center
        }

        .bump {
            animation: bump .4s
        }

        @keyframes bump {
            50% {
                transform: scale(1.5)
            }
        }

        .bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: var(--sf);
            border-top: 1px solid var(--l2);
            display: flex;
            z-index: 9;
            padding-bottom: env(safe-area-inset-bottom)
        }

        .bar a {
            flex: 1;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--mu);
            align-content: center
        }

        .bar a.on {
            color: var(--pr);
            font-weight: 700
        }

        .bar span {
            font-size: 20px
        }

        .hero {
            position: relative;
            margin-top: 24px;
            padding: 32px 24px;
            border-radius: 28px;
            background: var(--s2);
            display: grid;
            gap: 16px;
            overflow: hidden
        }

        .hero .pz {
            width: min(60vw, 300px);
            margin: auto;
            animation: spin 1.4s cubic-bezier(.2, .8, .2, 1) both
        }

        @keyframes spin {
            from {
                transform: rotate(-200deg) scale(.4);
                opacity: 0
            }
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center
        }

        .sp {
            justify-content: space-between
        }

        .g {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr))
        }

        .card {
            background: var(--sf);
            border: 1px solid var(--l2);
            border-radius: 16px;
            padding: 12px;
            transition: border-color .2s
        }

        .card:hover {
            border-color: var(--pr)
        }

        .img {
            height: 150px;
            border-radius: 12px;
            background: var(--s2);
            display: grid;
            place-items: center;
            font-size: 56px;
            margin-bottom: 12px
        }

        .img svg {
            width: 110px
        }

        .card h3,
        .card p {
            padding: 0 4px
        }

        .card .row {
            padding: 8px 4px 0
        }

        .price {
            font-size: 18px;
            color: var(--pr)
        }

        .add {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--pr);
            background: none;
            color: var(--pr);
            font: 600 24px/1 Inter;
            cursor: pointer;
            transition: .15s
        }

        .add:hover {
            background: var(--pr);
            color: var(--on)
        }

        .add:active {
            transform: scale(.9)
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 16px 0
        }

        .chip {
            min-height: 44px;
            padding: 0 20px;
            border-radius: 22px;
            border: 1.5px solid var(--ln);
            background: var(--sf);
            color: var(--tx);
            font: 500 15px Inter;
            cursor: pointer
        }

        .chip.on {
            background: var(--pr);
            border-color: var(--pr);
            color: var(--on);
            font-weight: 600
        }

        .chip[disabled] {
            opacity: .4;
            text-decoration: line-through;
            cursor: not-allowed
        }

        label {
            display: block;
            font: 600 13px Inter;
            margin: 16px 0 6px
        }

        input,
        textarea {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border: 1.5px solid var(--ln);
            border-radius: 12px;
            background: var(--sf);
            color: var(--tx);
            font: 16px Inter
        }

        textarea {
            min-height: 96px
        }

        input[aria-invalid=true] {
            border-color: var(--er)
        }

        .err {
            color: var(--er);
            font-size: 13px;
            font-weight: 500;
            display: block;
            min-height: 0
        }

        .lk {
            color: var(--pr);
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: 0;
            font-size: 14px;
            padding: 10px
        }

        .box {
            background: var(--sf);
            border: 1px solid var(--l2);
            border-radius: 16px;
            padding: 20px
        }

        .sm2 div {
            display: flex;
            justify-content: space-between;
            padding: 6px 0
        }

        .tot {
            border-top: 1px solid var(--l2);
            margin-top: 8px;
            padding-top: 12px !important;
            font-weight: 700;
            font-size: 20px
        }

        .tot b {
            color: var(--pr)
        }

        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin: 12px 0
        }

        .cal b {
            text-align: center;
            font-size: 13px;
            color: var(--mu)
        }

        .d {
            aspect-ratio: 1;
            min-height: 44px;
            border: 1.5px solid var(--l2);
            border-radius: 10px;
            background: var(--sf);
            color: var(--tx);
            font: 500 15px Inter;
            cursor: pointer
        }

        .d.on {
            background: var(--pr);
            color: var(--on);
            border-color: var(--pr);
            font-weight: 700;
            animation: pop .25s
        }

        .d[disabled] {
            opacity: .4;
            cursor: default
        }

        @keyframes pop {
            50% {
                transform: scale(1.12)
            }
        }

        .qty {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .qty button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--pr);
            background: none;
            color: var(--pr);
            font: 600 22px Inter;
            cursor: pointer
        }

        .qty b {
            min-width: 24px;
            text-align: center;
            font-size: 20px
        }

        .it {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--l2)
        }

        .it .im {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--s2);
            display: grid;
            place-items: center;
            font-size: 26px
        }

        .it svg {
            width: 40px
        }

        .kp {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
        }

        .kp div {
            padding: 20px;
            border-radius: 16px;
            background: var(--sf);
            border: 1px solid var(--l2)
        }

        .kp b {
            display: block;
            font: 700 30px 'Playfair Display';
            color: var(--pr)
        }

        .map {
            height: 160px;
            border-radius: 16px;
            background: var(--s2) repeating-linear-gradient(90deg, transparent 0 78px, var(--sf) 78px 84px), repeating-linear-gradient(0deg, transparent 0 58px, var(--sf) 58px 64px);
            position: relative;
            margin: 16px 0
        }

        .map:after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 26px;
            height: 26px;
            margin: -13px;
            border-radius: 50%;
            background: var(--pr);
            border: 8px solid var(--on);
            box-shadow: 0 0 0 6px #c8372d44
        }

        .stp {
            display: flex;
            margin: 24px 0 8px
        }

        .stp div {
            flex: 1;
            text-align: center;
            font-size: 13px;
            color: var(--mu);
            position: relative
        }

        .stp div:before {
            content: '';
            display: block;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--l2);
            margin: 0 auto 8px;
            position: relative;
            z-index: 1;
            transition: .5s
        }

        .stp div:after {
            content: '';
            position: absolute;
            top: 12px;
            left: -50%;
            width: 100%;
            height: 3px;
            background: var(--l2);
            transition: .5s
        }

        .stp div:first-child:after {
            display: none
        }

        .stp .dn:before,
        .stp .dn:after {
            background: var(--gr)
        }

        .stp .ac:before {
            background: var(--pr);
            box-shadow: 0 0 0 6px #c8372d33
        }

        .stp .ac:after {
            background: var(--gr)
        }

        .stp .dn,
        .stp .ac {
            color: var(--tx);
            font-weight: 600
        }

        .ok svg {
            width: 96px;
            display: block;
            margin: 16px auto
        }

        .ok path {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: dr .6s .2s forwards
        }

        @keyframes dr {
            to {
                stroke-dashoffset: 0
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 520px
        }

        th {
            text-align: left;
            color: var(--mu);
            font-weight: 600
        }

        th,
        td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--l2)
        }

        .tw {
            overflow-x: auto
        }

        .tg {
            font-weight: 700;
            color: var(--pr)
        }

        .tg.z {
            color: var(--gr)
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translate(-50%, 20px);
            background: var(--tx);
            color: var(--bg);
            padding: 12px 20px;
            border-radius: 12px;
            opacity: 0;
            transition: .3s;
            z-index: 20;
            pointer-events: none;
            max-width: 90vw;
            text-align: center
        }

        #toast.on {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        footer {
            margin-top: 56px;
            padding: 32px 0;
            border-top: 1px solid var(--l2);
            color: var(--mu);
            font-size: 14px
        }

        footer .g {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))
        }

        @media(min-width:768px) {
            body {
                padding-bottom: 0
            }

            .bar {
                display: none
            }

            .links {
                display: flex
            }

            .hero {
                grid-template-columns: 1.1fr 1fr;
                align-items: center;
                padding: 56px
            }

            .hide-m {
                display: inline-flex
            }

            #toast {
                bottom: 24px
            }
        }

        @media(max-width:767px) {
            .hide-m {
                display: none
            }
        }

        @media(max-width:560px) {
            .g {
                grid-template-columns: 1fr
            }

            .card {
                display: grid;
                grid-template-columns: 88px 1fr;
                column-gap: 12px;
                align-items: center
            }

            .card .img {
                grid-row: span 3;
                height: 88px;
                margin: 0;
                font-size: 36px
            }

            .card .img svg {
                width: 64px
            }

            .card .row {
                grid-column: 2
            }
        }

        .chip.sm3 {
            padding: 0 14px;
            font-size: 13px
        }

        .card .chips {
            grid-column: 2
        }

        .banner {
            background: var(--pr);
            color: var(--on);
            text-align: center;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 14px
        }

        .tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 99px;
            background: var(--s2);
            font-size: 13px;
            font-weight: 600
        }

        .bar2 {
            display: grid;
            grid-template-columns: 130px 1fr 36px;
            gap: 12px;
            align-items: center;
            margin: 8px 0
        }

        .bar2 i {
            display: block;
            height: 14px;
            border-radius: 7px;
            background: var(--pr);
            transition: width .6s
        }

        .bar2 b {
            text-align: right
        }

        input[type=search] {
            -webkit-appearance: none
        }

        .i {
            vertical-align: -.2em;
            flex: none
        }

        .ic,
        .ic .i {
            color: var(--tx)
        }

        .ib {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--s2);
            color: var(--pr);
            display: grid;
            place-items: center;
            margin-bottom: 12px
        }

        .img {
            color: var(--pr)
        }

        .img svg.i {
            width: 56px;
            height: 56px
        }

        .card .img svg.i {
            width: 48px;
            height: 48px
        }

        .it .i {
            width: 28px;
            height: 28px;
            color: var(--pr)
        }

        .bar span {
            display: grid;
            place-items: center
        }

        .bar .i {
            width: 22px;
            height: 22px
        }

        .fq {
            border-bottom: 1px solid var(--l2);
            padding: 14px 0
        }

        .fq summary {
            cursor: pointer;
            font-weight: 600;
            list-style: none;
            display: flex;
            justify-content: space-between;
            gap: 12px
        }

        .fq summary::-webkit-details-marker {
            display: none
        }

        .fq summary:after {
            content: '+';
            color: var(--pr);
            font-size: 22px;
            line-height: 1
        }

        .fq[open] summary:after {
            content: '−'
        }

        .fq p {
            margin-top: 8px
        }

        .ol {
            padding-left: 22px
        }

        .ol li {
            margin: 8px 0
        }

        main:focus {
            outline: 0
        }

        footer p {
            margin-top: 6px;
            line-height: 1.9
        }

        footer a:hover {
            color: var(--pr)
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }

        /* ===== Módulo 4: capa de producto / interfaz profesional ===== */
        :root {
            --ok: #1D6E45;
            --warn: #8A5A00;
            --info: #155C84;
            --danger: #A62A22;
            --r1: 12px;
            --r2: 18px;
            --r3: 26px;
            --ring: 0 0 0 4px color-mix(in srgb, var(--pr) 18%, transparent)
        }

        .skip {
            position: fixed;
            left: 16px;
            top: -80px;
            z-index: 100;
            background: var(--tx);
            color: var(--bg);
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            transition: .2s
        }

        .skip:focus {
            top: 12px
        }

        body {
            min-height: 100vh
        }

        .wrap {
            width: min(100% - 32px, 1200px)
        }

        .nav {
            box-shadow: 0 1px 0 color-mix(in srgb, var(--l2) 70%, transparent)
        }

        .ni {
            height: 72px
        }

        .logo {
            letter-spacing: -.02em
        }

        .logo .pz {
            width: 30px;
            height: 30px
        }

        .links a {
            transition: .2s
        }

        .links a:hover {
            background: var(--s2)
        }

        .btn {
            box-shadow: 0 6px 16px color-mix(in srgb, var(--pr) 15%, transparent)
        }

        .btn.s {
            box-shadow: none
        }

        .btn:focus-visible,
        .chip:focus-visible,
        .ic:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            box-shadow: var(--ring)
        }

        .ic {
            display: grid;
            place-items: center;
            border: 1px solid transparent
        }

        .ic:hover {
            border-color: var(--l2)
        }

        main.wrap {
            min-height: 58vh;
            padding-bottom: 24px
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin: 30px 0 20px
        }

        .page-head h1 {
            margin: 0
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--pr);
            margin-bottom: 8px
        }

        .eyebrow svg {
            width: 15px;
            height: 15px
        }

        .hero.pro {
            padding: clamp(28px, 5vw, 64px);
            min-height: 440px;
            background: linear-gradient(135deg, var(--s2), color-mix(in srgb, var(--sf) 35%, var(--s2)));
            border: 1px solid var(--l2);
            box-shadow: var(--sh)
        }

        .hero-copy {
            max-width: 610px
        }

        .hero.pro h1 {
            font-size: clamp(38px, 6vw, 64px);
            letter-spacing: -.035em
        }

        .hero.pro .lead {
            font-size: clamp(16px, 2vw, 19px);
            max-width: 580px;
            margin: 14px 0 26px
        }

        .hero-art {
            display: grid;
            place-items: center;
            position: relative
        }

        .hero-art:before,
        .hero-art:after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 1px solid color-mix(in srgb, var(--pr) 25%, transparent)
        }

        .hero-art:before {
            width: 340px;
            height: 340px
        }

        .hero-art:after {
            width: 270px;
            height: 270px
        }

        .hero-art .pz {
            position: relative;

            }

            }

            }

            }

            }

            }

            }
        }

        @media(max-width:430px) {

            }

            }

                padding: 0 13px
            }

            .account-head {
                display: block
            }

            .avatar {
                margin-bottom: 12px
            }
        }
    </style>
</head>

<div class="section-head"><div><span class="eyebrow">Servicio digital</span><h2>Todo el recorrido está conectado</h2></div><p class="mu">La demo simula el flujo completo que tendría una aplicación real, incluyendo validaciones, estados y operación interna.</p></div><div class="feature-grid">${[['calendar', 'Reserva con disponibilidad', 'Bloqueo de horarios ocupados, límite de aforo, anticipación mínima y confirmación.'], ['cart', 'Pedido estructurado', 'Tamaños, cantidades, cupones, pedido mínimo, zona de reparto y costo calculado.'], ['pin', 'Seguimiento de entrega', 'Estados del pedido visibles para el cliente y actualizables desde el panel.'], ['shield', 'Control del negocio', 'Roles, permisos, auditoría, reportes, configuración y avisos al cliente.']].map(x => `<article class="feature"><div class="ib">${ic(x[0], 23)}</div><h3>${x[1]}</h3><p class="mu">${x[2]}</p></article>`).join('')}</div>
<div class="section-head"><div><span class="eyebrow">Recomendados</span><h2>Favoritos de la casa</h2></div><a class="lk" href="#/carta">Ver carta completa</a></div><div class="g">${P.slice(0, 4).map(card).join('')}</div>
<div class="section-head"><div><span class="eyebrow">Flujo del cliente</span><h2>Simple por fuera, robusto por dentro</h2></div></div><div class="process"><div class="box"><h3>Elige</h3><p class="mu">Explora la carta o selecciona fecha, hora y número de personas.</p></div><div class="box"><h3>Confirma</h3><p class="mu">La app valida datos, disponibilidad, zona, monto y método de pago antes de registrar.</p></div><div class="box"><h3>Haz seguimiento</h3><p class="mu">Recibe avisos, revisa el estado y consulta tu historial desde tu cuenta.</p></div></div>
<div class="section-head"><div><span class="eyebrow">Información operativa</span><h2>Antes de continuar</h2></div></div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))">${info('clock', 'Horario', 'Martes a domingo de 13:00 a 00:00. Lunes cerrado.')}${info('truck', 'Delivery', 'Cobertura en Chiclayo, José Leonardo Ortiz, La Victoria y Pimentel.')}${info('tag', 'Pedido mínimo', money(S.cfg.min) + ' antes del costo de delivery.')}${info('phone', 'Atención', 'Consultas y casos especiales desde la sección Contacto.')}</div>`
        };

        /* Carta con búsqueda visible y contexto */
        R.carta = () => `<div class="page-head"><div><span class="eyebrow">Carta digital</span><h1>Nuestra carta</h1><p class="mu">Precios directos, tamaños configurables y carrito persistente.</p></div><span class="meta-pill">${ic('cart', 15)} ${qty()} producto${qty() == 1 ? '' : 's'} en carrito</span></div>${!S.cfg.open ? pvNotice('info', 'Pedidos temporalmente pausados', 'Puedes explorar la carta y preparar tu carrito. Se conservará hasta que el negocio reactive los pedidos.', 'warn') : ''}<div class="searchbox">${ic('search', 20)}<input id="bq" type="search" placeholder="Buscar pizza, pasta, bebida o postre" value="${esc(S.q)}" aria-label="Buscar en la carta"></div><div class="chips" role="tablist" aria-label="Categorías">${['Pizzas', 'Pastas', 'Bebidas', 'Postres'].map(c => `<button class="chip ${S.cat == c ? 'on' : ''}" data-a="cat" data-c="${c}" role="tab" aria-selected="${S.cat == c}">${c}</button>`).join('')}</div><div class="g" id="pg">${list()}</div>`;

        /* Titular: paso claro */
        const pvOldTit = R.titular; R.titular = () => {if (!S.rv?.t) return go('reservar'); return `<div class="nar">${pvFlow(2)}<span class="eyebrow">Paso 2 de 3</span><h1>Datos del titular</h1><p class="mu">Usaremos estos datos para identificar tu reserva y enviarte avisos.</p>${pvNotice('info', 'Revisa antes de confirmar', `Reserva para ${S.rv.n} persona${S.rv.n == 1 ? '' : 's'}, el ${S.rv.d} de ${MES[S.rv.m]} a las ${S.rv.t}.`)}${fld('tn', 'Nombre completo', 'Tu nombre', 'text', S.me.n)}${fld('tt', 'Teléfono', '999 888 777', 'tel', S.me.c)}${fld('tm', 'Correo (opcional)', 'tucorreo@ejemplo.com', 'email', S.me.m)}<label for="tx">Solicitud especial (opcional)</label><textarea id="tx" placeholder="Ej.: mesa de fácil acceso, silla para niño"></textarea><p class="mu" style="font-size:12px;margin-top:6px">Las solicitudes están sujetas a disponibilidad del local.</p><br><button class="btn w" data-a="confRes">${ic('check', 18)} Confirmar reserva</button><p class="ctr"><button class="lk" data-go="reservar">Volver a fecha y hora</button></p></div>`};

        /* Selector post-login */
        R.selector = () => `<div class="page-head"><div><span class="eyebrow">Cuenta activa</span><h1>Hola, ${esc(S.me.n.split(' ')[0])}</h1><p class="mu">¿Qué deseas gestionar ahora?</p></div><a class="btn s sm" href="#/cuenta">${ic('user', 18)} Mi cuenta</a></div><div class="g mid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))"><a class="card" href="#/reservar" style="padding:24px"><div class="ib">${ic('calendar', 25)}</div><h3>Reservar mesa</h3><p class="mu">Consulta disponibilidad real de la demo, selecciona hora y recibe tu código.</p><div class="row" style="margin-top:16px"><span class="lk">Iniciar reserva</span></div></a><a class="card" href="#/carta" style="padding:24px"><div class="ib">${ic('truck', 25)}</div><h3>Pedir a domicilio</h3><p class="mu">Arma tu pedido, define zona, método de pago y realiza seguimiento.</p><div class="row" style="margin-top:16px"><span class="lk">Ver carta</span></div></a></div>`;

        /* Checkout: estructura de app con resumen persistente */
        const pvOldCheckout = R.checkout; R.checkout = () => {if (!S.cart.length || (!S.me && !S.guest)) return pvOldCheckout(); if (!S.cfg.open) return empty(ic('lock', 56), 'Pedidos pausados', '<p class="mu">Tu carrito sigue guardado. Intenta nuevamente cuando el negocio reactive la recepción.</p><br><a class="btn" href="#/carta">Volver a la carta</a>'); if (S.me && role() != 'cliente') return empty(ic('chef', 56), 'Cuenta del negocio', '<p class="mu">Este perfil está destinado a la operación. Para comprar usa una cuenta de cliente.</p>'); const f = S.f, pay = S.pay || 'Yape'; return `<div class="page-head"><div><span class="eyebrow">Checkout seguro · Demo</span><h1>Entrega y pago</h1><p class="mu">Completa los datos requeridos y revisa el total antes de confirmar.</p></div></div><div class="checkout-grid"><section><div class="box"><h3>1. Datos de entrega</h3>${!S.me ? fld('gn', 'Nombre completo', 'Tu nombre', 'text', f.gn) + fld('gt', 'Celular', '999 888 777', 'tel', f.gt) : `<p class="mu" style="margin-top:8px">Pedido a nombre de <b style="color:var(--tx)">${esc(S.me.n)}</b> · ${esc(S.me.c)}</p>`}${fld('ad', 'Dirección de entrega', 'Calle, avenida y número', 'text', f.ad)}${fld('rf', 'Referencia (opcional)', 'Ej.: portón negro, frente al parque', 'text', f.rf)}</div><br><div class="box"><h3>2. Zona de reparto</h3><div class="chips">${Object.entries(ZN).map(([z, [c, e]]) => `<button class="chip ${S.zone == z ? 'on' : ''}" data-a="zone" data-z="${z}">${z} · ${money(c)}</button>`).join('')}</div>${pvNotice('truck', 'Tiempo estimado', ZN[S.zone][1] + ' desde la confirmación. El tiempo puede variar por demanda o tráfico.')}</div><br><div class="box"><h3>3. Método de pago</h3><div class="method-grid">${[['Yape', 'Solicitud al celular'], ['Tarjeta', 'Validación de tarjeta'], ['Efectivo', 'Indica el monto para vuelto']].map(([m, d]) => `<button class="method ${pay == m ? 'on' : ''}" data-a="pay" data-m="${m}"><span>${m}</span><small>${d}</small></button>`).join('')}</div>${pay == 'Tarjeta' ? fld('cn2', 'Número de tarjeta', '4111 1111 1111 1111') + `<div class="row"><div style="flex:1">${fld('ex', 'Vencimiento', '08/28')}</div><div style="flex:1">${fld('cv', 'CVV', '123', 'password')}</div></div>` : pay == 'Efectivo' ? fld('ef', 'Monto con el que pagarás (S/)', '100', 'number') : pvNotice('phone', 'Pago con Yape', 'En esta demostración el pago se simula. En una app real se integraría el proveedor de pago.')}</div></section><aside class="sticky"><div class="summary-card"><h3>Resumen del pedido</h3>${S.cart.map(i => `<div class="row sp" style="padding:7px 0;border-bottom:1px solid var(--l2)"><span>${i.q} × ${esc(nm(i))}</span><b>${money(i.q * up(i))}</b></div>`).join('')}<div style="margin-top:10px">${sum([['Subtotal', money(sub())], ...(disc() ? [['Descuento', '− ' + money(disc())]] : []), ['Delivery · ' + S.zone, money(dlv())]], money(tot()))}</div><button class="btn w" data-a="place" style="margin-top:16px">${ic('shield', 18)} Confirmar pedido</button><p class="mu" style="font-size:12px;text-align:center;margin-top:10px">Al confirmar, se genera un pedido de demostración con seguimiento.</p></div></aside></div>`};

        /* Tracking: línea de tiempo más informativa */
        R.tracking = id => {const mine = S.orders.filter(o => S.me ? o.by == S.me.c : o.id == id), o = S.orders.find(x => x.id == id) || mine[mine.length - 1]; if (!o) return empty(ic('pizza', 56), 'Aún no tienes pedidos', '<a class="btn" href="#/carta">Ver carta</a>'); if (o.by && o.by != S.me?.c && !can('orders')) return go(''); const msgs = ['Pedido registrado y pendiente de preparación.', 'El equipo está preparando los productos.', 'El pedido salió del local y va hacia la dirección indicada.', 'El pedido fue marcado como entregado.']; return `<div class="mid"><div class="page-head"><div><span class="eyebrow">Seguimiento</span><h1>Pedido #${o.id}</h1><p class="mu">${fmt(o.ts)} · ${esc(o.zone || 'Chiclayo')}</p></div>${pvStatus(stt(o), o.x ? 'bad' : o.st == 3 ? 'good' : o.st == 2 ? 'info' : 'warn')}</div>${o.x ? pvNotice('ban', 'Pedido cancelado', 'Este pedido fue cancelado y ya no continuará avanzando.', 'danger') : pvNotice(o.st == 3 ? 'check' : 'clock', o.st == 3 ? 'Pedido completado' : 'Estado actual', msgs[o.st], o.st == 3 ? 'ok' : '')}<div class="box"><div class="timeline">${EST.map((e, i) => `<div class="timeline-item ${i < o.st ? 'done' : i == o.st ? 'on' : ''}"><b>${e}</b><span>${i == 0 ? 'Pedido recibido por el sistema.' : i == 1 ? 'Preparación en cocina.' : i == 2 ? 'Repartidor asignado y en ruta.' : 'Entrega finalizada.'}</span></div>`).join('')}</div></div><h2 style="font-size:20px;margin-top:24px">Entrega</h2><div class="box"><p><b>${ic('pin', 17)} ${esc(o.addr)}</b></p>${o.ref ? `<p class="mu" style="margin-top:4px">Referencia: ${esc(o.ref)}</p>` : ''}<p class="mu" style="margin-top:8px">Tiempo estimado: ${o.st == 3 ? 'Completado' : ZN[o.zone]?.[1] || ETA[o.st]}</p></div><h2 style="font-size:20px">Detalle</h2>${sum([...o.items.map(i => [`${i.q} × ${nm(i)}`, money(i.q * up(i))]), ...(o.disc ? [['Descuento', '− ' + money(o.disc)]] : []), ['Delivery', money(o.dlv ?? 5)]], money(o.total))}${o.st == 3 && !o.x ? (o.rate ? `<p class="notice ok" style="margin-top:16px">${ic('star', 18)} <b>Calificación registrada: ${o.rate}/5</b></p>` : `<div class="box ctr" style="margin-top:18px"><h3>Califica tu experiencia</h3><p class="mu" style="margin:5px 0 12px">Tu opinión ayuda a completar el flujo de posventa.</p><div class="row" style="justify-content:center">${[1, 2, 3, 4, 5].map(n => `<button class="ic" data-a="rate" data-id="${o.id}" data-n="${n}" aria-label="${n} estrellas">${n}</button>`).join('')}</div></div>`) : ''}<br><a class="btn s w" href="#/cuenta">Volver a Mi cuenta</a></div>`};

        /* Cuenta con encabezado de perfil */
        const pvOldCuenta = R.cuenta; R.cuenta = () => {const old = pvOldCuenta(); const me = S.me; return `<div class="account-head"><div class="row"><div class="avatar">${ic('user', 24)}</div><div><span class="eyebrow">Mi cuenta</span><h1 style="font-size:28px;margin:0">${esc(me.n)}</h1><p class="mu">${esc(me.c)} · ${TAG[role()]}</p></div></div><button class="btn s sm" data-a="out">Cerrar sesión</button></div>` + old.replace(/<h1>Hola,[\s\S]*?<div class="chips"/, '<div class="chips"')};

        /* Panel: navegación lateral y KPIs reales de la demo */
        const pvOldPanel = R.panel; R.panel = () => {if (!can('orders')) return go('login'); const ok = S.orders.filter(o => !o.x), active = ok.filter(o => o.st < 3).length, todayRes = S.res.filter(r => r.st == 'Confirmada').length, revenue = ok.reduce((s, o) => s + o.total, 0), tabs = [['orders', 'list', 'Pedidos', 1], ['res', 'calendar', 'Reservas', 1], ['money', 'chart', 'Reportes', can('money')], ['cfg', 'settings', 'Configuración', can('cfg')], ['log', 'shield', 'Actividad', can('log')]].filter(x => x[3]); const full = pvOldPanel(); const start = full.indexOf('<div class="chips"'), end = start >= 0 ? full.indexOf('</div>', start) : -1; let content = full; if (start >= 0 && end >= 0) content = full.slice(end + 6); content = content.replace(/^<h1>[\s\S]*?<\/p>/, ''); return `<div class="page-head"><div><span class="eyebrow">Operación interna</span><h1>Panel del negocio</h1><p class="mu">Vista de demostración con permisos por rol, estados y trazabilidad.</p></div><span class="meta-pill">${ic('user', 15)} ${TAG[role()]}</span></div><div class="metric-grid"><div class="metric"><span class="m-label">Pedidos activos</span><b>${active}</b><small>En proceso actualmente</small></div><div class="metric"><span class="m-label">Reservas confirmadas</span><b>${todayRes}</b><small>Registradas en la demo</small></div><div class="metric"><span class="m-label">Ventas acumuladas</span><b>${money(revenue)}</b><small>Pedidos no cancelados</small></div><div class="metric"><span class="m-label">Alertas</span><b>${S.orders.filter(o => o.x).length}</b><small>Pedidos cancelados</small></div></div><div class="panel-shell"><aside class="panel-side" aria-label="Secciones del panel">${tabs.map(([k, i, t]) => `<button class="${S.tab == k ? 'on' : ''}" data-a="ptab" data-t="${k}">${ic(i, 18)} ${t}</button>`).join('')}</aside><section class="panel-main">${content}</section></div>`};

        /* Confirmaciones destructivas y administrativas */
        const pvCancelR = A.cancelR, pvCancelO = A.cancelO, pvReset = A.reset0, pvCfgOpen = A.cfgOpen;
        A.cancelR = d => pvModal('Cancelar reserva', 'La reserva quedará registrada como cancelada y el horario volverá a estar disponible.', 'Cancelar reserva', () => pvCancelR(d), 'calendar');
        A.cancelO = d => {const o = S.orders.find(x => x.id == d.id); if (o && o.st > 0 && !can('orders')) return toast('Ya está en preparación y no se puede cancelar'); pvModal('Cancelar pedido', 'Esta acción detendrá el pedido. En una aplicación real podría depender de la política de devolución.', 'Cancelar pedido', () => pvCancelO(d), 'ban')};
        A.reset0 = d => pvModal('Reiniciar datos de demostración', 'Se restablecerán pedidos, reservas, avisos, actividad e inasistencias de esta demo.', 'Reiniciar demo', () => pvReset(d), 'settings');
        A.cfgOpen = d => pvModal(S.cfg.open ? 'Pausar pedidos' : 'Reanudar pedidos', S.cfg.open ? 'Mientras estén pausados, los clientes podrán ver la carta pero no confirmar pedidos.' : 'Los clientes volverán a poder confirmar pedidos desde el checkout.', S.cfg.open ? 'Pausar' : 'Reanudar', () => pvCfgOpen(d), 'settings');

        /* Confirmación final con progreso */
        const pvConfirm = R.confirmacion; R.confirmacion = id => {const h = pvConfirm(id); if (typeof h !== 'string') return h; return h.replace('<div class="nar ok ctr">', `<div class="nar ok ctr">${pvFlow(3)}`)};

        /* Ajuste final de render: marca de entorno demo y aria-current */
        const pvRender = render; render = function (soft) {pvRender(soft); $$('.links a,.bar a').forEach(a => {if (a.classList.contains('on')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current')}); const main = $('#main'); if (main && !main.querySelector('.demo-ribbon') && can('orders')) {const r = document.createElement('div'); r.className = 'notice demo-ribbon'; r.innerHTML = `<div class="ni2">${ic('info', 18)}</div><div><b>Entorno demostrativo</b><p>Los datos y pagos de esta versión son simulados para exposición.</p></div>`; main.prepend(r)} };
        render();

    </script>
</body>

</html>
